name: Build and deploy GitHub Pages

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    env:
      SITE_URL: https://highlanderrobotics.github.io
      BASE_PATH: /frc8033.com/
      PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Read configured Pages URL
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5

      - name: Use configured domain and path
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const origin = new URL(process.env.PAGES_ORIGIN).origin;
            const base = process.env.PAGES_BASE_PATH || "/";
            appendFileSync(process.env.GITHUB_ENV, `SITE_URL=${origin}\nBASE_PATH=${base}\n`);
          '

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate and build the site
        run: npm run check

      - name: Test desktop and mobile browsers
        run: npm run test:e2e

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
